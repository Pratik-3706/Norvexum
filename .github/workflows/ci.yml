name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly, so new security advisories show up even without pushes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  check:
    name: Clippy & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: most users run it there, and the Windows-only code
        # paths (cmd.exe, taskkill, CREATE_NO_WINDOW, winres) only compile there.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libvulkan-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libdbus-1-dev \
            pkg-config libssl-dev

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Advisories in transitive dependencies appear without any code change, so
    # they are reported (annotations / check run) but don't turn the build red.
    continue-on-error: true
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # zip 8.x (RUSTSEC-2026-0367/0368/0369) only reaches us through
          # headless_chrome's `fetch` feature, which unpacks the Chromium build it
          # downloads from Google, never user-supplied archives. headless_chrome
          # 1.0.22 (latest) still requires zip ^8.6; drop these once it moves to 9.
          ignore: RUSTSEC-2026-0367,RUSTSEC-2026-0368,RUSTSEC-2026-0369
